name: CI

on:
  push:
    branches: [Moaz_Workspace, main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  api:
    name: API lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.14
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install development tools
        run: python -m pip install -r apps/api/requirements-dev.txt
      - name: Ruff
        run: ruff check apps/api
      - name: Mypy
        run: mypy apps/api/app
      - name: Pytest
        run: pytest apps/api/tests

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config --quiet

  migration-replay:
    name: Migration replay
    runs-on: ubuntu-latest
    needs: [compose]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.14
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install migration dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt
      - name: Start PostgreSQL 17.11
        run: docker compose up -d postgres
      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U classvoice -d classvoice; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1
      - name: Upgrade, downgrade, and re-upgrade migrations
        env:
          DATABASE_URL: postgresql+asyncpg://classvoice:change-me-local-only@localhost:5432/classvoice
          CLASSVOICE_INTEGRATION_DATABASE_URL: postgresql://classvoice:change-me-local-only@localhost:5432/classvoice
        run: |
          alembic -c db/alembic.ini upgrade head
          pytest apps/api/tests/test_identity_migration.py apps/api/tests/test_voice_schema_migration.py apps/api/tests/test_generation_schema_migration.py apps/api/tests/test_integrations_audit_migration.py
          alembic -c db/alembic.ini downgrade base
          alembic -c db/alembic.ini upgrade head
      - name: Tear down database
        if: always()
        run: docker compose down -v
