name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  api:
    name: API lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.14
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install development tools
        run: python -m pip install -r apps/api/requirements-dev.txt
      - name: Ruff
        run: ruff check apps/api
      - name: Mypy
        run: mypy apps/api/app
      - name: Pytest
        run: pytest apps/api/tests

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config --quiet

  migration-replay:
    name: Migration replay gate
    runs-on: ubuntu-latest
    needs: [compose]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Replay migrations when present
        shell: bash
        run: |
          shopt -s nullglob
          migrations=()
          for path in db/migrations/*; do
            [[ "${path##*/}" == ".gitkeep" ]] && continue
            migrations+=("$path")
          done
          if (( ${#migrations[@]} == 0 )); then
            echo "No migration files yet; P1-04 will activate the replay check."
            exit 0
          fi
          echo "Migration files detected. The database replay command is owned by P1-04."
          docker compose config --quiet
