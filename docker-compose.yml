name: classvoice

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-classvoice}
      POSTGRES_USER: ${POSTGRES_USER:-classvoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4.2
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  storage:
    image: localstack/localstack:4.10.0
    environment:
      SERVICES: s3
      DEBUG: "0"
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "${S3_PORT:-4566}:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-local}
      MODEL_REGISTRY_PATH: /opt/classvoice/model-registry/manifest.json
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-classvoice}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-classvoice}
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://storage:4566
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-local-only}
      S3_BUCKET_VOICE_INPUTS: voice-inputs
      S3_BUCKET_VOICE_DERIVED: voice-derived
      S3_BUCKET_GENERATED_AUDIO: generated-audio
      S3_BUCKET_EXPORTS: exports
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/opt/classvoice/health_server.py", "--check", "http://127.0.0.1:8000/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: ["python", "/opt/classvoice/health_server.py", "--port", "8001"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      MODEL_REGISTRY_PATH: /opt/classvoice/model-registry/manifest.json
      WORKER_DEVICE: ${WORKER_DEVICE:-cpu}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-classvoice}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-classvoice}
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://storage:4566
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-local-only}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/opt/classvoice/health_server.py", "--check", "http://127.0.0.1:8001/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/v1}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/opt/classvoice/health_server.mjs", "--check", "http://127.0.0.1:3000/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  localstack-data:
